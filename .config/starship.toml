"$schema" = 'https://starship.rs/config-schema.json'

# 1. Performance
command_timeout = 1000
scan_timeout = 30

# 2. Structure: User -> OS -> Directory -> Git...
# Flow: Red (#ea6962) -> Orange (#e78a4e) -> Grey (#504945) -> Darker...
format = """
[╭─](fg:#ea6962)\
[ $username](bg:#ea6962 fg:#282828)\
[](bg:#e78a4e fg:#ea6962)\
[ $os](bg:#e78a4e fg:#282828)\
[](bg:#504945 fg:#e78a4e)\
$directory\
[](fg:#504945 bg:#3c3836)\
$git_branch\
$git_status\
[](fg:#3c3836 bg:#282828)\
$c\
$rust\
$golang\
$nodejs\
$php\
$java\
$kotlin\
$haskell\
$python\
$lua\
[](fg:#282828 bg:#1d2021)\
$time\
[ ](fg:#1d2021)\
$cmd_duration\
\n[╰─](fg:#ea6962)$character"""

# 3. User Module (New First Section)
[username]
show_always = true
style_user = "bg:#ea6962 fg:#282828" 
style_root = "bg:#ea6962 fg:#282828"
format = '[$user ]($style)'

# 4. The OS Module (Second Section)
[os]
disabled = false
style = "bg:#e78a4e fg:#ebdbb2"
format = '[$symbol]($style)'

[os.symbols]
Windows = " "
Arch = " "
NixOS = ""
Ubuntu = " "
Debian = " "
Raspbian = " "
Macos = " "
Linux = " "
Unknown = " "

# 5. Directory (Third Section)
[directory]
style = "fg:#ebdbb2 bg:#504945" # Cream text on Grey
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"
read_only = "  "

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "
"Desktop" = " "

# 6. Git (Bg: Darker Grey #3c3836)
[git_branch]
symbol = " "
style = "bg:#3c3836"
format = '[[ $symbol $branch ](fg:#a9b665 bg:#3c3836)]($style)'

[git_status]
style = "bg:#3c3836"
format = '[[($all_status$ahead_behind )](fg:#ebdbb2 bg:#3c3836)]($style)'

# 7. Languages (Bg: Very Dark Grey #282828)
[nodejs]
symbol = " "
style = "bg:#282828"
format = '[[ $symbol ($version) ](fg:#d3869b bg:#282828)]($style)'

[rust]
symbol = " "
style = "bg:#282828"
format = '[[ $symbol ($version) ](fg:#e78a4e bg:#282828)]($style)'

[golang]
symbol = " "
style = "bg:#282828"
format = '[[ $symbol ($version) ](fg:#8FD3E7 bg:#282828)]($style)'

[php]
symbol = " "
style = "bg:#282828"
format = '[[ $symbol ($version) ](fg:#89b482 bg:#282828)]($style)'

[python]
symbol = " "
style = "bg:#282828"
format = '[[ $symbol ($version) ](fg:#d8a657 bg:#282828)]($style)'

[lua]
symbol = " "
style = "bg:#282828"
format = '[[ $symbol ($version) ](fg:#51A0CF bg:#282828)]($style)'

# 8. Time & Duration
[time]
disabled = false
time_format = "%R" 
style = "bg:#1d2021"
format = '[[   $time ](fg:#a89984 bg:#1d2021)]($style)'

[cmd_duration]
min_time = 2000
format = "[$duration ](bold yellow)"

# 9. Prompt Character
[character]
success_symbol = "[λ](bold #ea6962)"   # Gruvbox Red
error_symbol = "[λ](bold #d8a657)" # Gruvbox Yellow
vimcmd_symbol = "[Ω](bold #a9b665)"  # Omega for VIM mode
